# .github/workflows/deploy.yml
# Deploys the repo to GitHub Pages on every push to main.
# No build step needed — it's a static site (HTML + CSS + JS).

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # change to "master" if that's your default branch
  workflow_dispatch:  # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-flight runs on new pushes
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Upload the whole repo root as the site.
      # If you move index.html into a subfolder (e.g. /docs), change path below.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."          # root of the repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
